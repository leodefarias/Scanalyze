name: Deploy Backend API to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'microscope-measurement-system/backend-java/**'
      - 'microscope-measurement-system/.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  AZURE_REGISTRY_NAME: scanalyze
  AZURE_CONTAINER_APP_NAME: scanalyze-api
  AZURE_RESOURCE_GROUP: rg-scanalyze
  IMAGE_NAME: scanalyze-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.AZURE_REGISTRY_NAME }}.azurecr.io
        username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
        password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.AZURE_REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}
        tags: |
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./microscope-measurement-system/backend-java
        file: ./microscope-measurement-system/backend-java/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Container Apps
      uses: azure/container-apps-deploy-action@v1
      with:
        containerAppName: ${{ env.AZURE_CONTAINER_APP_NAME }}
        resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
        imageToDeploy: ${{ env.AZURE_REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
        environmentVariables: |
          ORACLE_HOST=${{ secrets.ORACLE_HOST }}
          ORACLE_PORT=${{ secrets.ORACLE_PORT }}
          ORACLE_SID=${{ secrets.ORACLE_SID }}
          ORACLE_USER=${{ secrets.ORACLE_USER }}
          ORACLE_PASSWORD=secretref:oracle-password

    - name: Logout from Azure
      run: az logout
      if: always()
